<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中考倒计时</title>

<style>
@font-face {
    font-family: 'MyTextFont';
    src: url('./FZDaBiaoSong.otf') format('truetype');
    font-display: swap;
}

@font-face {
    font-family: 'MyNumFont';
    src: url('./NEU-HZ.otf') format('truetype');
    font-display: swap;
}

:root {
    --text-font: 'MyTextFont', 'SimSun', serif;
    --num-font: 'MyNumFont', 'Times New Roman', serif;
    --base-font: clamp(14px, 2vw, 16px);
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    font-family: var(--text-font);
    font-size: var(--base-font);
    padding: 20px;
}

.container {
    text-align: center;
    width: 100%;
    max-width: 1200px;
}

.title {
    font-size: clamp(24px, 5vw, 42px);
    font-weight: normal;
    margin-bottom: clamp(20px, 4vw, 40px);
    letter-spacing: 0.05em;
}

.time {
    display: flex;
    justify-content: center;
    gap: clamp(10px, 3vw, 25px);
    flex-wrap: wrap;
}

.block {
    text-align: center;
    min-width: clamp(60px, 15vw, 100px);
}

.num {
    font-size: clamp(40px, 10vw, 72px);
    color: #ff0000;
    font-weight: normal;
    font-family: var(--num-font);
    line-height: 1.1;
}

.label {
    font-size: clamp(16px, 3vw, 22px);
    margin-top: clamp(4px, 1vw, 8px);
    font-family: var(--text-font);
    opacity: 0.9;
}

@media (max-width: 480px) {
    .time {
        gap: 10px;
    }
    .block {
        min-width: 70px;
    }
}
</style>
</head>

<body>
<div class="container">
    <div class="title">距离中考（6 月 20 日）仅剩</div>
    <div class="time">
        <div class="block"><div class="num" id="d">00</div><div class="label">天</div></div>
        <div class="block"><div class="num" id="h">00</div><div class="label">时</div></div>
        <div class="block"><div class="num" id="m">00</div><div class="label">分</div></div>
        <div class="block"><div class="num" id="s">00</div><div class="label">秒</div></div>
    </div>
</div>

<script>
const target = new Date("2026-06-20T00:00:00");

function updateTime() {
    const now = new Date();
    const diff = target - now;
    if (diff <= 0) {
        document.querySelector(".time").innerHTML = "<div style='font-size:clamp(24px,5vw,48px);color:red;'>中考已开始！</div>";
        return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById("d").innerText = String(d).padStart(2,"0");
    document.getElementById("h").innerText = String(h).padStart(2,"0");
    document.getElementById("m").innerText = String(m).padStart(2,"0");
    document.getElementById("s").innerText = String(s).padStart(2,"0");
}
updateTime();
setInterval(updateTime, 1000);
</script>
</body>
</html>
